name: Run prodato.py

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC
    - cron: '0 12 * * *'  # 12:00 UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2  # ažurirano na verziju koja podržava Node.js 24[reference:3]

      - name: Set up Python
        uses: actions/setup-python@v5.5.0  # ažurirano na verziju koja podržava Node.js 24[reference:4]

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4.3.0  # ažurirano na verziju koja podržava Node.js 24[reference:5]

      - name: Install Playwright browsers and system dependencies
        run: |
          playwright install --with-deps chromium

      - name: Install xvfb (virtuelni X server)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run prodato.py
        run: xvfb-run python prodato.py
