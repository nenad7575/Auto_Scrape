yaml
name: Run prodato.py

on:
  schedule:
    - cron: '0 6 * * *'   # 08:00 po srpskom vremenu (UTC+2)
    - cron: '0 14 * * *'  # 16:00 po srpskom vremenu
  workflow_dispatch:        # omogućava i ručno pokretanje sa GitHub-a

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run prodato.py
        run: python prodato.py

      - name: Commit changes (ako skripta menja fajlove u repou)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "Automatski update: prodato.py $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
