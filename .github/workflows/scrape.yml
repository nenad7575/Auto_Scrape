name: Run prodato.py

on:
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC
    - cron: '0 12 * * *'  # 12:00 UTC
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.2

      - name: Set up Python
        uses: actions/setup-python@v5.5.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Cache Playwright browsers
        uses: actions/cache@v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers and system dependencies
        run: |
          playwright install --with-deps chromium

      - name: Install xvfb (virtuelni X server)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Run prodato.py
        run: xvfb-run python prodato.py

      - name: Commit and push updated JSON
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "nenad7575@gmail.com"
          git add polovni_oglasi.json
          git diff --staged --quiet || git commit -m "Automatsko ažuriranje polovni_oglasi.json [skip ci]"
          git push https://${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}@github.com/${Auto_Scrape}.git

      - name: Show results
        run: |
          ls -la
          cat polovni_oglasi.json | head -50 || echo "JSON ne postoji"
