name: Run prodato.py

on:
  schedule:
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'   # zameni sa tvojom verzijom

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          # Ako nemaš requirements.txt, dodaj i playwright:
          # pip install playwright

      - name: Install Playwright browsers
        run: |
          playwright install chromium   # instalira samo Chromium (može i --with-deps)
          # Ako koristiš i Firefox ili WebKit, dodaj i njih:
          # playwright install firefox webkit

      - name: Run prodato.py
        run: python prodato.py
